[package]
name = "popm"
version = "0.1.0"
edition = "2021"
authors = ["PoloniumOS Team"]
description = "PoloniumOS Package Manager"

[dependencies]
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
tar         = "0.4"
flate2      = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2        = "0.10"
clap        = { version = "4",   features = ["derive"] }
colored     = "2"
indicatif   = "0.17"
dirs        = "5"
anyhow      = "1"
libc        = "0.2"
tempfile    = "3"
walkdir     = "2"

[profile.release]
opt-level = 3
strip = true
lto = true
